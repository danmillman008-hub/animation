<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>B3 — toast-lifecycle (gsap)</title>
<style>
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #e2e8f0;
  }
  #canvas {
    position: relative;
    width: 640px;
    height: 360px;
    background: #f8fafc;
    overflow: hidden;
  }
  #toast {
    position: absolute;
    left: 170px;   /* (640 - 300) / 2 */
    top: 148px;    /* (360 - 64) / 2 */
    width: 300px;
    height: 64px;
    background: #0f172a;
    border-radius: 12px;
  }
  #msg {
    position: absolute;
    left: 170px;
    top: 148px;
    width: 300px;
    height: 64px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    font-size: 15px;
    font-weight: 600;
    color: #f1f5f9;
    pointer-events: none;
  }
</style>
</head>
<body>
  <div id="canvas">
    <div id="toast"></div>
    <div id="msg">Saved</div>
  </div>

  <script src="../../../assets/gsap.min.js"></script>
  <script>
    // Initial state: offset 60px to the right, fully transparent.
    gsap.set("#toast, #msg", { x: 60, opacity: 0 });

    var tl = gsap.timeline();

    // 0–400ms: slide in from the right (+60px -> 0) + fade in, together.
    tl.to("#toast, #msg", {
      x: 0,
      opacity: 1,
      duration: 0.4,
      ease: "power2.out"
    }, 0);

    // 400–2200ms: hold (no tweens scheduled — nothing moves).

    // 2200–2600ms: slide out to the right (0 -> +60px) + fade out, together.
    tl.to("#toast, #msg", {
      x: 60,
      opacity: 0,
      duration: 0.4,
      ease: "power2.in"
    }, 2.2);

    // Scene duration: 3200ms (timeline idle from 2600ms onward, elements faded out).
  </script>
</body>
</html>
