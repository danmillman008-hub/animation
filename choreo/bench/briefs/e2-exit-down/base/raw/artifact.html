<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>B3 — toast-lifecycle (raw)</title>
<style>
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    display: grid;
    place-items: center;
    background: #ffffff;
  }
  #canvas {
    position: relative;
    width: 640px;
    height: 360px;
    background: #f8fafc;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  }

  /*
    Timeline (scene 3200ms):
      0–400     slide in from right 60px + fade in
      400–2200  hold
      2200–2600 slide out right 60px + fade out
      2600–3200 stay faded out (fill-mode holds final keyframe)
    One 2600ms linear animation; keyframe stops:
      400/2600  = 15.3846%
      2200/2600 = 84.6154%
  */
  @keyframes toast-lifecycle {
    0%        { transform: translateX(60px); opacity: 0; }
    15.3846%  { transform: translateX(0);    opacity: 1; }
    84.6154%  { transform: translateX(0);    opacity: 1; }
    100%      { transform: translateX(60px); opacity: 0; }
  }

  /* toast: 300x64 centered in 640x360 -> left 170, top 148 */
  #toast {
    position: absolute;
    left: 170px;
    top: 148px;
    width: 300px;
    height: 64px;
    background: #0f172a;
    border-radius: 12px;
    opacity: 0;
    transform: translateX(60px);
    animation: toast-lifecycle 2600ms linear 0ms both;
  }

  /* msg: sibling of toast (so it animates identically, not doubly),
     box 100x28 centered at (320,180) -> strictly inside the toast rect */
  #msg {
    position: absolute;
    left: 270px;
    top: 166px;
    width: 100px;
    height: 28px;
    line-height: 28px;
    text-align: center;
    color: #f1f5f9;
    font-size: 15px;
    font-weight: 600;
    opacity: 0;
    transform: translateX(60px);
    animation: toast-lifecycle 2600ms linear 0ms both;
  }
</style>
</head>
<body>
  <div id="canvas">
    <div id="toast"></div>
    <div id="msg">Saved</div>
  </div>
</body>
</html>
