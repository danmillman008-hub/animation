<style>
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    display: grid;
    place-items: center;
    background: #ffffff;
  }
  #canvas {
    position: relative;
    width: 800px;
    height: 450px;
    background: #f1f5f9;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
  }

  /* card: 320x200, centered in the 800x450 canvas */
  #card {
    position: absolute;
    left: 240px;   /* (800 - 320) / 2 */
    top: 125px;    /* (450 - 200) / 2 */
    width: 320px;
    height: 200px;
    background: #ffffff;
    border-radius: 16px;
    box-shadow: 0 4px 16px rgba(15, 23, 42, 0.08);
    opacity: 0;
    animation: card-fade-in 500ms ease-out 0ms forwards;
  }
  @keyframes card-fade-in {
    from { opacity: 0; }
    to   { opacity: 1; }
  }

  /* badge: circle r=28, horizontally centered in card, 36px from card top */
  #badge {
    position: absolute;
    left: 372px;   /* card left 240 + (320/2) - 28 */
    top: 161px;    /* card top 125 + 36 */
    width: 56px;
    height: 56px;
    border-radius: 50%;
    background: #16a34a;
    opacity: 0;
    transform: scale(0.3);
    animation: badge-pop 400ms cubic-bezier(0.34, 1.56, 0.64, 1) 600ms forwards;
  }
  @keyframes badge-pop {
    0%   { opacity: 0; transform: scale(0.3); }
    60%  { opacity: 1; transform: scale(1.08); }
    100% { opacity: 1; transform: scale(1); }
  }

  /* label: below badge with 18px gap; slides up ~10px while fading in */
  #label {
    position: absolute;
    left: 240px;                /* span the card width, center the text */
    top: 235px;                 /* badge bottom (161 + 56) + 18 */
    width: 320px;
    text-align: center;
    color: #0f172a;
    font-size: 18px;
    font-weight: 600;
    line-height: 1.2;
    opacity: 0;
    transform: translateY(10px);
    animation: label-rise 400ms ease-out 1100ms forwards;
  }
  @keyframes label-rise {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: translateY(0); }
  }
</style>

<div id="canvas">
  <div id="card"></div>
  <div id="badge"></div>
  <div id="label">Payment received</div>
</div>
