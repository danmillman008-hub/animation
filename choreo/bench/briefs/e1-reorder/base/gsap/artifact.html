<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>B1 — badge-pop (gsap)</title>
<style>
  html, body { margin: 0; }
  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #ffffff;
  }
  #canvas {
    position: relative;
    width: 800px;
    height: 450px;
    background: #f1f5f9;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  #card {
    position: absolute;
    left: 240px;   /* (800 - 320) / 2 */
    top: 125px;    /* (450 - 200) / 2 */
    width: 320px;
    height: 200px;
    background: #ffffff;
    border-radius: 16px;
    box-shadow: 0 4px 12px rgba(15, 23, 42, 0.08);
  }
  #badge {
    position: absolute;
    left: 132px;   /* (320 - 56) / 2, centered in card */
    top: 36px;     /* ≈36px margin from card top */
    width: 56px;   /* circle r≈28 */
    height: 56px;
    border-radius: 50%;
    background: #16a34a;
  }
  #label {
    position: absolute;
    left: 0;
    top: 110px;    /* badge top 36 + 56 diameter + 18px gap */
    width: 100%;
    text-align: center;
    color: #0f172a;
    font-size: 18px;
    font-weight: 600;
    line-height: 1;
  }
</style>
</head>
<body>
  <div id="canvas">
    <div id="card">
      <div id="badge"></div>
      <div id="label">Payment received</div>
    </div>
  </div>

  <script src="../../../assets/gsap.min.js"></script>
  <script>
    // Initial states — applied the moment the script runs.
    gsap.set("#card", { opacity: 0 });
    gsap.set("#badge", { opacity: 0, scale: 0.3, transformOrigin: "50% 50%" });
    gsap.set("#label", { opacity: 0, y: 10 });

    var tl = gsap.timeline();

    // 0–500ms: card fades in
    tl.to("#card", { opacity: 1, duration: 0.5, ease: "power1.out" }, 0);

    // 600–1000ms: badge pops in (scale 0.3→1 with springy overshoot + fade)
    tl.to("#badge", { scale: 1, duration: 0.4, ease: "back.out(2)" }, 0.6);
    tl.to("#badge", { opacity: 1, duration: 0.4, ease: "power1.out" }, 0.6);

    // 1100–1500ms: label slides up ~10px + fades in
    tl.to("#label", { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" }, 1.1);

    // Nothing moves after 1500ms; scene duration 2400ms.
  </script>
</body>
</html>
